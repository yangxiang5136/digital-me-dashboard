<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigation design comparison</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:#eef1f5;color:#111827;font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  h1{margin:0 0 20px;font-size:24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  figure{margin:0;padding:14px;border:1px solid #d9dee7;border-radius:16px;background:#fff;box-shadow:0 8px 28px rgba(16,24,40,.08)}
  figcaption{margin-bottom:10px;font-weight:650}
  .crop{height:250px;overflow:hidden;border:1px solid #e4e7ec;border-radius:10px;background:#fbfcfe}
  img{display:block;width:100%;height:auto}
  .note{margin:20px 0 0;color:#475467}
</style>
</head>
<body>
  <h1>Portfolio → Digital Me · 顶部导航视觉对照</h1>
  <div class="grid">
    <figure>
      <figcaption>视觉基线 · Personal Portfolio</figcaption>
      <div class="crop"><img src="design-source-portfolio-nav.jpg" alt="Portfolio navigation source"></div>
    </figure>
    <figure>
      <figcaption>实现结果 · Digital Me</figcaption>
      <div class="crop"><img src="design-after-digital-me-nav.jpg" alt="Digital Me navigation implementation"></div>
    </figure>
  </div>
  <p class="note">对齐项：固定半透明顶栏、轻量身份标识、胶囊分段导航、双语切换、滚动后的边界反馈。保留项：Digital Me 自己的内容层级与紫蓝色识别。</p>
</body>
</html>
