<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Me — CEO Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Source+Sans+3:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --display: 'Instrument Serif', Georgia, serif;
  --body: 'Source Sans 3', 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', 'Menlo', monospace;
  --bg: #0E0C0A;
  --text-primary: #F0E8DC;
  --text-body: #B0A498;
  --text-secondary: #807468;
  --text-dim: #504840;
  --warm: #E0A860;
  --green: #5EAA6E;
  --status-running: #7EC47E;
  --status-stopped: #CC9955;
  --status-planned: #666058;
  --border: rgba(255,255,255,0.05);
  --card-bg: rgba(255,255,255,0.02);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text-primary); font-family: var(--body); }
button { font-family: var(--mono); cursor: pointer; outline: none; }

@keyframes nodeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(2.2); opacity: 0; }
}

.dashboard { max-width: 1100px; margin: 0 auto; padding: 48px 36px 80px; }

/* Header */
.header h1 {
  font-family: var(--display); font-size: 44px; font-weight: 400;
  color: var(--text-primary); letter-spacing: 0.005em; line-height: 1.1; margin-bottom: 8px;
}
.header-meta {
  font-family: var(--mono); font-size: 14px; color: #6A6258;
  display: flex; gap: 12px; align-items: center;
}
.header-meta .sep { color: #3A3228; }

/* Section headers */
.section-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
}
.section-label {
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  color: #A09888; text-transform: uppercase; letter-spacing: 0.12em;
}
.section-line { flex: 1; height: 1px; background: rgba(255,255,255,0.035); }

/* Topology */
.topology-canvas {
  position: relative;
  min-height: 500px;
  min-width: 0;
  background: rgba(255,255,255,0.008);
  border: 1px solid rgba(255,255,255,0.04);
  border-radius: 16px;
}
.topology-scroll {
  overflow: auto;
  border-radius: 16px;
  margin-bottom: 4px;
}
.topology-canvas svg.connections {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
}
.col-label {
  position: absolute; top: 10px; z-index: 3;
  font-family: var(--mono); font-size: 12px; color: #807468;
  text-transform: uppercase; letter-spacing: 0.12em;
}

/* Agent cards */
.agent-card {
  position: absolute; width: 220px; z-index: 2; cursor: pointer;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.agent-card-inner {
  background: rgba(24,21,18,0.94);
  border: 1.5px solid rgba(212,165,116,0.18);
  border-radius: 12px; padding: 14px 16px;
  position: relative; overflow: hidden;
  backdrop-filter: blur(8px);
  transition: all 0.35s ease;
}
.agent-card.running .agent-card-inner {
  border-color: rgba(212,165,116,0.22);
}
.agent-card.dimmed .agent-card-inner {
  background: rgba(18,16,14,0.92);
  border-color: rgba(255,255,255,0.04);
}
.agent-card.highlight .agent-card-inner {
  border-color: rgba(224,180,110,0.45);
  box-shadow: 0 0 24px rgba(224,180,110,0.08);
}
.agent-card.faded { opacity: 0.25; }
.agent-card.highlight { transform: scale(1.02); }
.agent-glow {
  position: absolute; top: 0; left: 6%; right: 6%; height: 1px;
  background: linear-gradient(90deg, transparent, #C49A6C40, transparent);
}
.agent-name {
  font-family: var(--display); font-size: 20px; font-weight: 400;
  color: var(--text-primary); line-height: 1.2; letter-spacing: 0.005em;
}
.agent-meta {
  font-family: var(--mono); font-size: 13px; color: #8A8078; margin-top: 3px;
}
.agent-desc {
  font-family: var(--body); font-size: 14px; color: #9A9088;
  line-height: 1.45; margin: 8px 0;
}
.agent-status {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 12px;
}
.status-dot {
  position: relative; display: inline-flex; width: 9px; height: 9px;
}
.status-dot-inner {
  width: 7px; height: 7px; border-radius: 50%; margin: auto;
}
.status-dot-pulse {
  position: absolute; inset: 0; border-radius: 50%;
  background-color: var(--status-running); opacity: 0.3;
  animation: pulse 2.4s ease-in-out infinite;
}

/* File nodes */
.file-node {
  position: absolute; z-index: 2; cursor: pointer;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.file-node.faded { opacity: 0.2; }
.file-node.highlight { transform: scale(1.04); }
.file-node-inner {
  background: rgba(24,21,18,0.88);
  border: 1.5px solid rgba(255,255,255,0.06);
  border-radius: 8px; padding: 8px 14px;
  backdrop-filter: blur(6px); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis;
  transition: all 0.35s ease;
}
.file-node.highlight .file-node-inner {
  border-color: rgba(224,180,110,0.4);
  box-shadow: 0 0 16px rgba(224,180,110,0.06);
}
.file-node.stale .file-node-inner {
  background: rgba(196,154,108,0.05);
  border-color: rgba(196,154,108,0.16);
}
.file-name {
  font-family: var(--mono); font-size: 14px; color: #B8ACA0;
  display: flex; align-items: center; gap: 7px;
}
.file-kind { font-size: 12px; color: #5A5248; }
.file-date { font-family: var(--mono); font-size: 12px; color: #5A5248; margin-top: 4px; padding-left: 19px; }

/* Layer toggles */
.layer-toggles { display: flex; gap: 8px; align-items: center; }
.layer-toggle {
  font-size: 13px; letter-spacing: 0.03em;
  background: transparent; border: 1px solid #2A2520;
  border-radius: 20px; padding: 5px 14px;
  color: #4A4238; display: flex; align-items: center; gap: 6px;
  transition: all 0.25s ease;
}
.layer-toggle.active { background: rgba(255,255,255,0.03); }
.layer-toggle .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #2A2520; transition: background 0.25s ease;
}

/* Cards grid */
.metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 44px; }
.card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 22px 26px;
}
.card-label {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  color: var(--text-secondary); text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 14px;
}
.card-big { font-family: var(--display); font-size: 48px; color: var(--text-primary); line-height: 1; }
.card-unit { font-family: var(--body); font-size: 16px; color: var(--text-secondary); margin-left: 8px; }

/* Aspect bars */
.aspect-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.aspect-name {
  width: 95px; font-family: var(--mono); font-size: 14px;
  color: #A09888; text-align: right; flex-shrink: 0;
}
.aspect-bar-bg {
  flex: 1; max-width: 140px; height: 8px;
  background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden;
}
.aspect-bar-fill {
  height: 100%; background: linear-gradient(90deg, #A08050, var(--warm));
  border-radius: 4px;
}
.aspect-val {
  font-family: var(--mono); font-size: 14px; color: #807468; width: 34px;
}

/* Direction items */
.direction-item {
  font-family: var(--display); font-size: 19px; font-style: italic;
  color: #D0C4B4; padding: 10px 0; line-height: 1.4;
  border-top: 1px solid rgba(255,255,255,0.03);
}
.direction-item:first-child { border-top: none; }

/* Improvements */
.improvement-item {
  font-family: var(--body); font-size: 15px; color: var(--text-body);
  padding: 10px 0; line-height: 1.5;
  border-top: 1px solid rgba(255,255,255,0.025);
  display: flex; align-items: flex-start; gap: 10px;
}
.improvement-marker { color: var(--warm); flex-shrink: 0; margin-top: 3px; font-size: 13px; }

/* Sparkline */
.sparkline { display: block; }

/* Footer */
.footer {
  text-align: center; font-family: var(--mono); font-size: 12px;
  color: #3A3228; letter-spacing: 0.05em; margin-top: 48px;
}

/* Warning emphasis */
.warning { color: var(--warm); }
</style>

h shared memory and sandboxes.", "Use gstack's SKILL.md template format as the foundation for Digital Me's skills folder structure. Adapt their CEO agent prompts and role-based agent specialization pattern for the Strategist Agent.", "Build a Memory Agent feature that tracks and surfaces when user activities drift from strategic to tactical based on task categorization, helping maintain strategic oversight.", "Add conversation turn count as an implicit interest-scoring metric in the scoring system \u2014 more back-and-forth exchanges on a topic indicate higher genuine interest.", "Create a mechanism for the system to surface novel tools, architectures, and structures from external sources (podcasts, repos, papers) to expand the user's 'knowledge library' and prevent the 'I don't know what I don't know' constraint.", "Implement checkpoint-based governance and edit diary for the self-improvement mechanism to prevent reward hacking \u2014 agents with tool access need guardrails against finding shortcuts that invalidate tasks.", "Invest in bus infrastructure (Phase B), skill systems (Phase A), and agent workspaces (Phase C) as priority \u2014 these constitute the 'environment' that makes agents effective. The system architecture is the differentiator, not which model API is called.", "Implement planner\u2192generator\u2192evaluator pattern with separate evaluator agent; use sprint contracts and checkpoint artifacts for long-running tasks.", "Add an evaluator mode to Digital Me (as a skill or lightweight agent) to review other agents' outputs and combat self-praise bias.", "Adopt three-layer command architecture and structured agent skills from larksuite/cli as a blueprint for Digital Me's shared skills folder.", "Phased migration to AutoGen v0.4 for microservice-based distributed agent architecture with progressive integration, starting with Strategist Agent.", "Consider using pretext library for efficient text measurement in agent dashboards to avoid DOM reflows.", "Implement autonomous evaluate\u2192modify\u2192test improvement loops for agents, and consider moving to markdown-based agent programming (program.md).", "Adopt Claude Code's bridge API pattern and session management for agent communication and context persistence.", "Add side-by-side AI chat and document editing interface with voice-driven revisions to support collaborative editing workflow.", "Implement automated validation for agent skill catalogs and enable agents to discover and integrate new APIs from a public directory.", "Develop personalization capability that infers user traits from limited interactions, using psychological frameworks and iterative feedback correction.", "Adapt the spec\u2192plan\u2192execute\u2192review autonomous workflow and composable skills system for Strategist Agent to enable long-running autonomous tasks.", "Create a process for systematically evaluating and integrating effective tools/structures from external sources into Digital Me.", "Build a comprehensive knowledge tree that records what has been learned, allowing AI agents to identify knowledge gaps and navigate connections designed for machine readability.", "Add implicit behavior inference capability to Digital Me to infer cognitive patterns from daily behavior, language choices, and feedback, using psychology and semantic analysis.", "Create an Execution Agent that enforces weekly implementation checkpoints, converting collected ideas into concrete user-validation steps.", "Implement multi-input synthesis pattern for the Strategist Agent and define agent contracts using persona-driven principles instead of rigid functional specs.", "Implement AI-powered memory compression and auto-capture mechanisms for each agent to automatically distill and inject context across sessions.", "Adopt Hermes-style autonomous skill creation triggers and self-improvement feedback loops so agents can evolve capabilities without manual intervention.", "Adopt the five-layer mental model distillation framework for the shared skills/ folder and consider building a Skill Distillation Agent.", "Incorporate proactive negative feedback mechanisms in any implicit inference feature to prevent unnoticed failures from seamless operation.", "Ensure the system explicitly acknowledges its memory capability limits and avoids performing memory retention rituals when true persistence is missing.", "Adopt a structured SKILL.md format with agent-specific configs for the skills folder, and add agent introspection/debugging capabilities.", "Implement self-wiring memory connections and overnight consolidation jobs for the shared memory bus, using markdown-based skills for agent autonomy.", "Build migration-friendly architecture that preserves all past context, workflows, and structure when users restructure their AI systems \u2014 the key capability is efficient carry-forward rather than forcing rebuild from scratch", "Redesign system architecture to be content-first and habit-first rather than architecture-first \u2014 all system design should serve content presentation and audience needs, not the reverse", "Define a standardized AI asset packaging format (GitHub repo model: zip + description document + chain) for the platform \u2014 creators use any external AI tool to generate content, then submit in platform format for certification", "Solve the 'first teaching fallacy' \u2014 early wrong prompts create persistent memory anchors that can't be fully erased, causing agents to drift. Need mechanisms for deep memory correction that don't just overlay but truly replace erroneous early inputs", "Implement emergent agent architecture where agents branch out from user needs organically rather than being pre-designed \u2014 start with minimal conversation companion and let agents differentiate based on concrete pain points, following the pattern already demonstrated (Memory \u2192 Connection Mapper \u2192 Strategist \u2192 Learning Agent)", "Write a 2000-3000 word first-person manifesto articulating the vision for personal AI \u2014 'Why I believe personal AI should be like this, and not like that.' Position the project as a thought movement rather than software, with the manifesto serving as the primary artifact for attracting early users, collaborators, and investors", "Implement an MCP server for Digital Me's shared memory bus so agents can self-register capabilities and discover each other's tools autonomously, following Scrapling's MCP pattern.", "Adopt Scrapling's agent-skill packaging format (SKILL.md + examples/ + references/ subfolders) as the template for the planned skills/ folder architecture.", "Build a pilot where the Strategist Agent is allowed to use Firecrawl's 'Agent' mode to autonomously gather data for strategic questions, as a test of director-mode operations.", "Add a Firecrawl media-parse action to shared skills so any agent can extract content from web-hosted documents (PDF, DOCX), expanding multi-modal input capabilities.", "Implement URL deduplication to prevent saving the same bookmark multiple times when the source has already been captured, reducing noise and duplicate entries.", "Improve repo analysis robustness: when automated analysis fails, implement retry logic or flag for manual review rather than leaving raw metadata-only entries.", "Use the existing knowledge base as a simulation environment where CI agents can role-play as any entity (expert, peer, user) to provide real-time feedback, as a transitional solution for integrating CI agents into the Digital Me system.", "Implement a 'dreaming' feature where agents retroactively analyze their own execution history after sessions to extract patterns, generate error corrections, and produce persistent guidance for future tasks \u2014 enabling autonomous self-improvement without manual retraining.", "Develop a structured methodology for the philosophy-engineering 'dialogue' \u2014 a way to formalize how philosophical/aesthetic vision collides with engineering constraints to produce coherent, well-designed products.", "Implement a declarative skill registry in Digital Me's skills/ folder using Multica's skill compounding pattern, where each completed task becomes a reusable skill component agents can invoke autonomously.", "Adopt a task lifecycle model (enqueue, claim, execute, complete/fail) for agent contracts, bringing structured state tracking to purpose-oriented agent assignments.", "Adopt the agency-agents markdown contract format (Identity \u2192 Mission \u2192 Workflows \u2192 Deliverables \u2192 Success Metrics) as the template for all Digital Me agent definitions in the skills/ folder.", "Add a 'Self-Improvement Protocols' section to agent contracts so agents can autonomously propose or integrate new capabilities, fulfilling the goal of self-maintaining agents.", "Consider whether Digital Me needs a 'skill factory' capability \u2014 a way to generate new agent skills from plain-language descriptions, similar to the Skill Creator plugin for Claude Code, to lower the barrier for extending the system.", "Apply the deny-and-continue pattern to Digital Me agents \u2014 when an agent action is blocked, return the denial as a tool result with instructions to find an alternative path, rather than halting for user input. Escalate to human only after threshold (e.g., 3 consecutive denials).", "Investigate and fix the content capture pipeline \u2014 the 4th item in source group 'article-2026-05-11-1506' was captured with a truncated title and no body content, suggesting a decomposition or extraction bug for certain content types.", "Dual-AI cross-validation workflow: Have one AI (Cloud Code) draft architecture docs and another AI (Codex) review/feedback them in iterative cycles, inspired by cross-model distillation concepts from podcast", "Personal agent should function as a 'historian' that tracks task time end-to-end, decomposes new tasks into sub-tasks with similarities to past tasks, and uses dynamic fitting to continuously improve time estimation accuracy", "When merging Digital Me into company architecture, avoid forcing team members to adopt new UIs/habits. Instead, allow independent user interfaces and habits, connecting through shared communication channels for interoperability", "Personalized agents need context-aware memory and skill classification to avoid decision-mode mismatches \u2014 e.g., preventing emotional-mode thinking from being applied to rational-decision contexts, analogous to human cognitive biases"], "addressed": 0, "deferred": 0}, "direction": {"growing_toward": ["Thinking deeper before building \u2014 going from interesting idea to clear enough understanding that I know what to build and why", "Making things that other people actually use, not just prototypes that prove a concept to myself", "Exploring design, aesthetics, and creativity \u2014 learning to think in ways that aren't purely engineering-driven", "Giving agents more agency \u2014 I want to control overall direction, not individual decisions. Agents should be able to improve themselves, explore tools and capabilities, and integrate what they find. They report what they did; I don't pre-approve each action.", "Moving from a system I maintain to a system that maintains itself \u2014 agents evolve, self-improve, and grow their capabilities over time with me as the director, not the operator"], "growing_away_from": ["Generating many ideas but staying shallow on all of them \u2014 I want fewer ideas taken further", "Jumping to implementation before I've really understood the problem at the level that matters"], "blind_spot_watch": ["Am I going deep on one idea this week, or scattering again?", "Have I spent time on something non-technical recently?", "Am I building for myself or for someone who'd actually use this?", "What would a designer think about what I'm making?", "Am I still acting as operator when I should be acting as director?"], "last_reviewed": "2026-03-25T02:51:49Z"}, "agents": [{"id": "memory function getAvatar(animal, highlight) {
  const a = (animal||'').toLowerCase();
  const svg = AVATARS[a] || '';
  const colors = (AVATAR_COLORS[a] || {})[highlight ? 'glow' : 'normal'] || {};
  return svg
    .replace(/#CLASS_FILL#/g, colors.FILL || '#1C1916')
    .replace(/#CLASS_STROKE#/g, colors.STROKE || '#3D3530')
    .replace(/#CLASS_BODY#/g, colors.BODY || '#888')
    .replace(/#CLASS_BODY2#/g, colors.BODY2 || '#666')
    .replace(/#CLASS_WEB#/g, colors.WEB || '#333')
    .replace(/#CLASS_EYE_RING#/g, colors.EYE_RING || '#888')
    .replace(/#CLASS_IRIS#/g, colors.IRIS || '#AA8030');
}

// ─── Helpers ───
function daysAgo(d) {
  if (!d) return null;
  const now = new Date();
  const then = new Date(d);
  const nowDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const thenDate = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  return Math.round((nowDate - thenDate) / 864e5);
}
function fmtAgo(d) {
  const n = daysAgo(d);
  if (n === null) return '\u2014';
  if (n === 0) return 'today';
  if (n === 1) return '1d ago';
  return n + 'd ago';
}

const kindIcons = { config: '\u2699', data: '\u25C6', output: '\u25B8', suggestion: '\uD83D\uDCA1' };
const statusColors = { running: '#7EC47E', stopped: '#CC9955', not_deployed: '#666058' };
const statusLabels = { running: 'Running', stopped: 'Stopped', not_deployed: 'Planned' };

// ─── Topology positions (from layout.json or defaults) ───
function getTopoPositions() {
  const topo = LAYOUT.topology || {};
  const agentPos = {};
  const filePos = {};
  (topo.agents || []).forEach(a => { agentPos[a.id] = { x: a.x, y: a.y }; });
  (topo.files || []).forEach(f => { filePos[f.id] = { x: f.x, y: f.y }; });
  return { agentPos, filePos };
}

// ─── State ───
let selected = null;
let layers = { reads: true, writes: true, agents: true, files: true };

function matchFilePattern(pattern, fileId) {
  // Normalize a file pattern like "connections/scores-*.json" to match a file id like "scores"
  let fid = pattern;
  fid = fid.replace('connections/', '').replace('rubric_history/', '');
  fid = fid.replace('.yaml', '').replace('.json', '').replace('.md', '');
  fid = fid.replace(/[-_]*\*[-_]*/g, '').replace(/ memories/g, '').trim();
  fid = fid.replace(/-+$/, '').replace(/^-+/, '');
  return fileId === fid || fileId.includes(fid) || fid.includes(fileId);
}

function isConnected(entityId) {
  if (!selected) return false;
  // Check if selected is an agent and entityId is a connected file
  const agent = STATE.agents.find(a => a.id === selected);
  if (agent) {
    const flow = agent.data_flow || {};
    const reads = flow.reads_from_bus || [];
    const writes = flow.writes_to_bus || [];
    return [...reads, ...writes].some(f => matchFilePattern(f, entityId));
  }
  // Check if selected is a file and entityId is a connected agent
  const isFile = STATE.shared_files.some(f => f.id === selected);
  if (isFile) {
    const ag = STATE.agents.find(a => a.id === entityId);
    if (ag) {
      const flow = ag.data_flow || {};
      const reads = flow.reads_from_bus || [];
      const writes = flow.writes_to_bus || [];
      return [...reads, ...writes].some(f => matchFilePattern(f, selected));
    }
  }
  return false;
}

function renderTopologyNodes() {
  const container = document.getElementById('topo-nodes');
  if (!container) return;
  const pos = getTopoPositions();
  let html = '';

  // Compute safe pixel positions to prevent card overlap
  const agentSpacing = 195;
  const fileSpacing = 72;
  const outputSpacing = 120;
  const nodeStartY = 40;
  const _centerFiles = STATE.shared_files.filter(f => f.kind !== 'output');
  const _outputFiles = STATE.shared_files.filter(f => f.kind === 'output');
  window._posPx = {};
  STATE.agents.forEach((a, i) => {
    window._posPx[a.id] = { xPct: (pos.agentPos[a.id]||{}).x || 3, yPx: nodeStartY + i * agentSpacing };
  });
  _centerFiles.forEach((f, i) => {
    window._posPx[f.id] = { xPct: (pos.filePos[f.id]||{}).x || 48, yPx: nodeStartY + i * fileSpacing };
  });
  _outputFiles.forEach((f, i) => {
    window._posPx[f.id] = { xPct: (pos.filePos[f.id]||{}).x || 80, yPx: nodeStartY + i * outputSpacing };
  });

  // Agent cards
  if (layers.agents) {
    STATE.agents.forEach((agent, i) => {
      const sp = window._posPx[agent.id] || { xPct: 3, yPx: nodeStartY + i * agentSpacing };
      const isSel = selected === agent.id;
      const conn = isConnected(agent.id);
      const highlight = isSel || conn;
      const faded = selected && !highlight;
      const statusColor = statusColors[agent.status] || '#666';
      const alive = agent.status === 'running';
      const avatarKey = agent.avatar || 'elephant';

      html += `<div class="agent-card ${agent.status} ${highlight?'highlight':''} ${faded?'faded':''}"
        style="left:${sp.xPct}%;top:${sp.yPx}px;animation:nodeIn .55s cubic-bezier(.16,1,.3,1) ${.15+i*.1}s both"
        onclick="event.stopPropagation();selectEntity('${agent.id}')">
        <div class="agent-card-inner">
          ${alive?'<div class="agent-glow"></div>':''}
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
            <div style="flex-shrink:0;line-height:0">${getAvatar(avatarKey, highlight)}</div>
            <div style="min-width:0">
              <div class="agent-name" style="font-weight:${highlight?600:400}">${agent.name}</div>
              <div class="agent-meta">${agent.version} \u00B7 ${agent.platform}</div>
            </div>
          </div>
          ${agent.description ? `<div class="agent-desc">${agent.description.substring(0,80)}${agent.description.length>80?'...':''}</div>`:''}
          <div class="agent-status">
            <div style="display:flex;align-items:center;gap:6px">
              <span class="status-dot">
                ${alive?'<span class="status-dot-pulse"></span>':''}
                <span class="status-dot-inner" style="background:${statusColor}"></span>
              </span>
              <span style="color:${statusColor};text-transform:uppercase;letter-spacing:.06em;font-size:12px">
                ${statusLabels[agent.status]||agent.status}</span>
            </div>
            ${agent.data_flow ? `<span style="color:#6A6258">${fmtAgo(STATE.memory.latest_capture)}</span>` : ''}
          </div>
        </div>
      </div>`;
    });
  }

  // File nodes
  if (layers.files) {
    STATE.shared_files.forEach((file, i) => {
      const sp = window._posPx[file.id] || { xPct: 48, yPx: nodeStartY + i * fileSpacing };
      const isSel = selected === file.id;
      const conn = isConnected(file.id);
      const highlight = isSel || conn;
      const faded = selected && !highlight;
      const age = daysAgo(file.last_updated);
      const stale = age > 14;

      html += `<div class="file-node ${highlight?'highlight':''} ${faded?'faded':''} ${stale?'stale':''}"
        style="left:${sp.xPct}%;top:${sp.yPx}px;animation:nodeIn .45s ease ${.35+i*.05}s both"
        onclick="event.stopPropagation();selectEntity('${file.id}')">
        <div class="file-node-inner">
          <div class="file-name">
            <span class="file-kind">${kindIcons[file.kind]||'\u00B7'}</span>
            <span title="${file.name}" style="color:${highlight?'#F0E0C8':stale?'#D4A870':'#B8ACA0'};font-weight:${highlight?500:400}">${file.name.length>25?file.name.replace('connections/','').replace('suggestions/',''):file.name}</span>
          </div>
          <div class="file-date" style="color:${highlight?'#A08868':stale?'#8A6E4E':'#5A5248'}">
            ${fmtAgo(file.last_updated)}${stale&&!highlight?' \u25CF':''}
          </div>
        </div>
      </div>`;
    });
  }

  container.innerHTML = html;
}

function renderConnections() {
  const svg = document.getElementById('conn-svg');
  const canvas = document.getElementById('topo-canvas');
  if (!svg || !canvas) return;
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  const pos = getTopoPositions();

  let paths = '';

  // Defs for markers
  paths += `<defs>
    <marker id="ar-r" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#5EAA6E" stroke-width="1.2"/></marker>
    <marker id="ar-w" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="7" markerHeight="5" orient="auto">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#E0A860" stroke-width="1.2"/></marker>
    <marker id="ar-rh" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#80D090" stroke-width="1.5"/></marker>
    <marker id="ar-wh" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#F0C070" stroke-width="1.5"/></marker>
    <marker id="ar-dim" viewBox="0 0 8 6" refX="7" refY="3" markerWidth="6" markerHeight="4" orient="auto">
      <path d="M0,0.5 L7,3 L0,5.5" fill="none" stroke="#2D2822" stroke-width="1"/></marker>
  </defs>`;

  STATE.agents.forEach(agent => {
    const ap = window._posPx ? window._posPx[agent.id] : null;
    if (!ap) return;
    const ax = (ap.xPct/100)*w + 248;
    const ay = ap.yPx + 38;
    const flow = agent.data_flow || {};

    function drawConn(filePattern, type) {
      if (type === 'read' && !layers.reads) return;
      if (type === 'write' && !layers.writes) return;

      // Match file pattern to a shared file id
      // Handle patterns like: direction.yaml, connections/scores-*.json, *.md, rubric_history/rubric-*.yaml
      let fid = filePattern;
      // Strip path prefixes
      fid = fid.replace('connections/', '').replace('rubric_history/', '');
      // Strip extensions
      fid = fid.replace('.yaml', '').replace('.json', '').replace('.md', '');
      // Strip wildcards and date patterns
      fid = fid.replace(/[-_]*\*[-_]*/g, '').replace(/ memories/g, '').trim();
      // Remove trailing hyphens
      fid = fid.replace(/-+$/, '').replace(/^-+/, '');

      const matchedFile = STATE.shared_files.find(f => {
        // Exact match
        if (f.id === fid) return true;
        // File name contains the pattern
        if (f.name === filePattern) return true;
        // Partial matches
        if (f.id.includes(fid) || fid.includes(f.id)) return true;
        // Match by stripped name
        const fname = f.name.replace('connections/', '').replace('.yaml', '').replace('.json', '').replace('.md', '').replace(/[-_]*\*[-_]*/g, '').replace(/ memories/g, '').replace(/-+$/, '').trim();
        if (fname === fid || fname.includes(fid) || fid.includes(fname)) return true;
        return false;
      });
      if (!matchedFile) return;
      const fp = window._posPx ? window._posPx[matchedFile.id] : null;
      if (!fp) return;

      const fx = (fp.xPct/100)*w;
      const fy = fp.yPx + 16;
      const dx = Math.abs(fx-ax);
      const cp = dx*0.42;

      const agentHighlight = selected===agent.id || selected===matchedFile.id;
      const dimmed = selected && !agentHighlight;
      const isW = type==='write';
      const alive = agent.status==='running';
      const notDeployed = agent.status==='not_deployed';

      let stroke, sw, opacity, dash, marker;
      if (dimmed) {
        stroke='#1E1A16'; sw=1; opacity=0.5; dash='3,5'; marker='url(#ar-dim)';
      } else if (agentHighlight) {
        stroke=isW?'#F0C070':'#80D090'; sw=2.5; opacity=1; dash=isW?'none':'6,4';
        marker=isW?'url(#ar-wh)':'url(#ar-rh)';
      } else if (notDeployed) {
        stroke=isW?'#8A7048':'#4A7A50'; sw=1; opacity=0.45; dash='4,4';
        marker=isW?'url(#ar-w)':'url(#ar-r)';
      } else if (alive) {
        stroke=isW?'#E0A860':'#5EAA6E'; sw=1.5; opacity=0.55; dash=isW?'none':'5,4';
        marker=isW?'url(#ar-w)':'url(#ar-r)';
      } else {
        stroke=isW?'#9A8058':'#4A8A56'; sw=1.2; opacity=0.4; dash=isW?'none':'5,4';
        marker=isW?'url(#ar-w)':'url(#ar-r)';
      }

      paths += `<path d="M${ax},${ay} C${ax+cp},${ay} ${fx-cp},${fy} ${fx},${fy}"
        fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-dasharray="${dash}"
        opacity="${opacity}" marker-end="${marker}" style="transition:all .35s ease"/>`;
    }

    (flow.reads_from_bus||[]).forEach(f => drawConn(f, 'read'));
    (flow.writes_to_bus||[]).forEach(f => drawConn(f, 'write'));
  });

  svg.innerHTML = paths;
}

function drawSparkline() {
  const canvas = document.getElementById('sparkline');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const data = STATE.memory.capture_frequency || [];
  if (!data.length) return;

  const w = canvas.width, h = canvas.height;
  const max = Math.max(...data.map(d => d.count), 1);
  const pts = data.map((d,i) => ({
    x: (i/(data.length-1))*w,
    y: h - (d.count/max)*(h-6) - 3
  }));

  // Area fill
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, 'rgba(224,168,96,0.2)');
  grad.addColorStop(1, 'rgba(224,168,96,0)');
  ctx.beginPath();
  pts.forEach((p,i) => i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // Line
  ctx.beginPath();
  pts.forEach((p,i) => i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle = '#E0A860'; ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();

  // Dots
  pts.forEach((p,i) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, i===pts.length-1?2.5:1.5, 0, Math.PI*2);
    ctx.fillStyle = i===pts.length-1?'#E0A860':'#7A6E5E';
    ctx.fill();
  });
}

// ─── Interaction ───
function selectEntity(id) {
  selected = selected === id ? null : id;
  renderTopologyNodes();
  renderConnections();
  // Update clear selection button visibility
  const clearBtn = document.getElementById('clear-btn');
  if (clearBtn) clearBtn.style.display = selected ? 'inline-block' : 'none';
}
function clearSelection() {
  selected = null;
  renderTopologyNodes();
  renderConnections();
  const clearBtn = document.getElementById('clear-btn');
  if (clearBtn) clearBtn.style.display = 'none';
}
function toggleLayer(key) {
  // Solo logic: clicking a toggle makes it the only active one in its group.
  // Clicking an already-solo toggle restores all in that group.
  const lineGroup = ['reads', 'writes'];
  const nodeGroup = ['agents', 'files'];
  const group = lineGroup.includes(key) ? lineGroup : nodeGroup;
  const otherKey = group.find(k => k !== key);

  if (layers[key] && !layers[otherKey]) {
    // Already solo — restore both
    layers[key] = true;
    layers[otherKey] = true;
  } else {
    // Solo this one — turn off the other
    layers[key] = true;
    layers[otherKey] = false;
  }

  renderTopologyNodes();
  renderConnections();
  // Update toggle button styles
  document.querySelectorAll('.layer-toggle').forEach(btn => {
    const k = btn.dataset.layer;
    if (k) {
      const active = layers[k];
      btn.classList.toggle('active', active);
      const dot = btn.querySelector('.dot');
      const colors = { reads:'#5EAA6E', writes:'#E0A860', agents:'#B8ACA0', files:'#B8ACA0' };
      if (dot) dot.style.background = active ? (colors[k]||'#B8ACA0') : '#2A2520';
      btn.style.borderColor = active ? (colors[k]||'#B8ACA0')+'40' : '#2A2520';
      btn.style.color = active ? (colors[k]||'#B8ACA0') : '#4A4238';
    }
  });
}

// ─── Init ───
function setCanvasSize() {
  const canvas = document.getElementById('topo-canvas');
  if (!canvas) return;
  const agentCount = STATE.agents.length;
  const centerFiles = STATE.shared_files.filter(f => f.kind !== 'output');
  const outputFiles = STATE.shared_files.filter(f => f.kind === 'output');
  // Match the spacing values used in renderTopologyNodes
  const agentBottom = 40 + (agentCount - 1) * 195 + 180; // startY + spacing + card height
  const centerBottom = 40 + (centerFiles.length - 1) * 72 + 50; // startY + spacing + node height
  const outputBottom = 40 + (outputFiles.length - 1) * 120 + 50;
  const height = Math.max(550, agentBottom + 40, centerBottom + 40, outputBottom + 40);
  canvas.style.height = height + 'px';
  canvas.style.width = canvas.parentElement.offsetWidth + 'px';
}
window.addEventListener('resize', () => { setCanvasSize(); renderConnections(); });
render();
setCanvasSize();
</script>
